<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Hayalet Yılan Oyunu oyna. Görünmez kuyruklu yılan ile heyecan verici ve zorlu bir deneyim. Ücretsiz ve akıcı yılan oyunu.">
    <meta name="keywords" content="hayalet yılan oyunu, ghost mode yılan, görünmez yılan oyunu, yılan oyunları, zor yılan oyunu">
    <title>Hayalet Modu | Ghost Snake - SnakeZilla TR</title>
    <style>
        /* Ghost/Ethereal Theme */
        body { margin: 0; background: #050510; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        #hud { position: absolute; top: 15px; background: rgba(255,255,255,0.05); padding: 10px 20px; border: 1px solid #70a1ff; border-radius: 10px; color: #70a1ff; font-weight: bold; backdrop-filter: blur(5px); }
        
        canvas { background: #000; border: 4px solid #70a1ff; box-shadow: 0 0 30px rgba(112, 161, 255, 0.2); }
        
        .overlay { position: absolute; background: rgba(0,0,0,0.9); border: 2px solid #70a1ff; padding: 40px; text-align: center; }
        .play-btn { background: #70a1ff; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .d-btn { width: 50px; height: 50px; background: #222; border: 1px solid #70a1ff; color: #70a1ff; display: flex; align-items: center; justify-content: center; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="hud">HAYALET MODU | SKOR: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div></div><div id="btnUp" class="d-btn">▲</div><div></div>
        <div id="btnLeft" class="d-btn">◄</div><div id="btnDown" class="d-btn">▼</div><div id="btnRight" class="d-btn">►</div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>HAYALET MODU</h1>
        <p style="color:#70a1ff;">Kuyruğun zamanla kaybolacak!</p>
        <button class="play-btn" onclick="initGame()">OYNA</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        let snake = [{x: 5, y: 10}], food = {x: 15, y: 10}, d = "RIGHT", nextD = "RIGHT";
        let score = 0, gameActive = false, tickRate = 180, lastTickTime = 0;

        function initGame() {
            document.getElementById("startScreen").style.display = "none";
            snake = [{x: 5, y: 10}]; score = 0; d = "RIGHT"; gameActive = true;
            lastTickTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(currentTime) {
            if(!gameActive) return;
            if(currentTime - lastTickTime >= tickRate) { logicTick(); lastTickTime = currentTime; }
            draw();
            requestAnimationFrame(gameLoop);
        }

        function logicTick() {
            d = nextD;
            let head = {x: snake[0].x, y: snake[0].y};
            if(d=="LEFT") head.x--; if(d=="UP") head.y--; if(d=="RIGHT") head.x++; if(d=="DOWN") head.y++;

            if(head.x<0 || head.x>=20 || head.y<0 || head.y>=20 || snake.some(s=>s.x==head.x && s.y==head.y)) {
                gameActive = false; alert("GÖRÜNMEZ OLDUN! Skor: " + score); location.reload();
            }

            snake.unshift(head);
            if(head.x == food.x && head.y == food.y) {
                score++; document.getElementById("scoreVal").innerText = score;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else snake.pop();
        }

        function draw() {
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,400,400);
            
            // Draw Food
            ctx.fillStyle = "#70a1ff"; ctx.fillRect(food.x*20+2, food.y*20+2, 16, 16);

            // Draw Snake with Ghost Effect
            snake.forEach((s, index) => {
                // Transparency based on position in tail
                let alpha = Math.max(0.1, 1 - (index / snake.length));
                ctx.globalAlpha = alpha;
                ctx.fillStyle = "#fff";
                ctx.fillRect(s.x*20+2, s.y*20+2, 16, 16);
                ctx.globalAlpha = 1.0;
            });
        }

        window.addEventListener('keydown', e => {
            if(e.keyCode==37 && d!="RIGHT") nextD="LEFT";
            else if(e.keyCode==38 && d!="DOWN") nextD="UP";
            else if(e.keyCode==39 && d!="LEFT") nextD="RIGHT";
            else if(e.keyCode==40 && d!="UP") nextD="DOWN";
        });
        
        const bindBtn = (id, dir) => document.getElementById(id).addEventListener("touchstart", (e)=>{e.preventDefault(); nextD=dir;});
        bindBtn("btnUp", "UP"); bindBtn("btnDown", "DOWN"); bindBtn("btnLeft", "LEFT"); bindBtn("btnRight", "RIGHT");
    </script>
</body>
</html>
