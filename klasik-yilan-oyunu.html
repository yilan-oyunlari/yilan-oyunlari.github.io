<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeZilla Pro Engine</title>
    <style>
        body { background: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #fff; font-family: 'Consolas', monospace; }
        #gameCanvas { background: #000; border: 2px solid #10ac84; box-shadow: 0 0 20px rgba(16,172,132,0.2); }
        .hud { width: 400px; display: flex; justify-content: space-between; padding: 10px; }
    </style>
</head>
<body>

    <div class="hud">
        <div>SKOR: <span id="score">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Fluid Snake State
        let snake = [{x: 200, y: 200}];
        let velocity = {x: 2, y: 0}; // Smooth velocity
        let targetVelocity = {x: 2, y: 0};
        
        function update() {
            // Linear Interpolation (Lerp) for smooth turn
            velocity.x += (targetVelocity.x - velocity.x) * 0.1;
            velocity.y += (targetVelocity.y - velocity.y) * 0.1;
            
            snake[0].x += velocity.x;
            snake[0].y += velocity.y;
            
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,400,400);
            ctx.fillStyle = "#10ac84";
            ctx.beginPath();
            ctx.arc(snake[0].x, snake[0].y, 10, 0, Math.PI*2);
            ctx.fill();
        }

        // Keyboard Controls
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowUp') targetVelocity = {x: 0, y: -2};
            if(e.key === 'ArrowDown') targetVelocity = {x: 0, y: 2};
            if(e.key === 'ArrowLeft') targetVelocity = {x: -2, y: 0};
            if(e.key === 'ArrowRight') targetVelocity = {x: 2, y: 0};
        });

        update();
    </script>
</body>
</html>
