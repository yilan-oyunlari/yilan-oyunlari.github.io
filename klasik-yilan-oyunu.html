<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Klasik Yılan Oyunu oyna. Nokia tarzı efsanevi yılan oyununun modern tarayıcı versiyonu. Ücretsiz, hızlı ve mobil uyumlu!">
    <meta name="keywords" content="klasik yılan oyunu, yılan oyunu oyna, nokia yılan oyunu, ücretsiz yılan oyunu">
    <title>Klasik Yılan Oyunu | Ücretsiz Online - SnakeZilla TR</title>
    <style>
        :root { --bg-color: #050505; --neon-green: #10ac84; --text-main: #ffffff; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Consolas', monospace; text-align: center; margin: 0; }
        
        /* UI Styles */
        header { padding: 20px; border-bottom: 2px solid var(--neon-green); }
        .score-board { margin: 20px; font-size: 1.2rem; color: var(--neon-green); }
        canvas { background: #000; border: 2px solid var(--neon-green); display: block; margin: auto; max-width: 95vw; }
        
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        .d-btn { width: 65px; height: 65px; background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .d-btn:active { background: var(--neon-green); color: #000; }
    </style>
</head>
<body>

    <header><h1>Klasik Yılan</h1></header>

    <div class="score-board">
        <div>SKOR: <span id="scoreDisplay">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div id="btnUp" class="d-btn">▲</div>
        <div style="display:flex; gap: 70px;">
            <div id="btnLeft" class="d-btn">◄</div>
            <div id="btnRight" class="d-btn">►</div>
        </div>
        <div id="btnDown" class="d-btn">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let box = 20, snake = [{x: 9*box, y: 10*box}], food = {x: 5*box, y: 5*box}, score = 0, d = "RIGHT";
        let speed = 150, changingDirection = false;

        // Bug Fix 1: Scroll Prevention
        document.addEventListener("keydown", e => {
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
            if(changingDirection) return; // Bug Fix 2: Suicide Lock
            if (e.keyCode == 37 && d != "RIGHT") { d = "LEFT"; changingDirection = true; }
            else if (e.keyCode == 38 && d != "DOWN") { d = "UP"; changingDirection = true; }
            else if (e.keyCode == 39 && d != "LEFT") { d = "RIGHT"; changingDirection = true; }
            else if (e.keyCode == 40 && d != "UP") { d = "DOWN"; changingDirection = true; }
        });

        function draw() {
            changingDirection = false;
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,400,400);
            
            // Draw Food
            ctx.fillStyle = "#ff9f43"; ctx.fillRect(food.x, food.y, box, box);

            // Move Snake
            let head = {x: snake[0].x, y: snake[0].y};
            if(d=="LEFT") head.x-=box; if(d=="UP") head.y-=box;
            if(d=="RIGHT") head.x+=box; if(d=="DOWN") head.y+=box;

            if(head.x == food.x && head.y == food.y) {
                score++; food = {x: (Math.floor(Math.random()*19)+1)*box, y: (Math.floor(Math.random()*19)+1)*box};
                document.getElementById("scoreDisplay").innerText = score;
            } else snake.pop();

            if(head.x<0 || head.x>=400 || head.y<0 || head.y>=400 || snake.some(s => s.x === head.x && s.y === head.y)) {
                alert("Oyun Bitti! Skor: " + score);
                location.reload();
            }

            snake.unshift(head);
            ctx.fillStyle = "#10ac84";
            snake.forEach(s => ctx.fillRect(s.x, s.y, box, box));
            setTimeout(draw, speed);
        }
        draw();
    </script>
</body>
</html>
