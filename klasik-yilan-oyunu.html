<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Yılan Oyunu - Fluid Edition</title>
    <style>
        /* Modern Geometric Background */
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #0d1117;
            background-image: radial-gradient(#2f3640 1px, transparent 1px);
            background-size: 30px 30px; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
            touch-action: none; /* Prevent mobile scroll */
        }

        /* Transparent Glassmorphism HUD */
        #hud {
            position: absolute; top: 15px; width: 90vw; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box; z-index: 5; font-weight: bold; font-size: 16px; color: #00d2d3;
        }

        .hud-item span { color: #fff; font-size: 18px; margin-left: 5px; }

        /* Game Canvas */
        canvas {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            border-radius: 12px; border: 2px solid rgba(0, 210, 211, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: block; max-width: 95vw;
        }

        /* UI Overlays */
        .overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(13, 17, 23, 0.95); padding: 40px; border-radius: 20px;
            border: 1px solid #00d2d3; box-shadow: 0 0 40px rgba(0, 210, 211, 0.2);
            text-align: center; z-index: 10; width: 80vw; max-width: 350px;
        }

        .overlay h1 { margin-top: 0; color: #00d2d3; font-size: 32px; letter-spacing: 2px; }

        /* Mode Selection */
        .mode-select { margin-bottom: 25px; padding: 10px; background: #1e272e; border: 1px solid #485460; color: #fff; border-radius: 8px; width: 100%; font-size: 16px; outline: none; cursor: pointer;}

        /* Clean Play Button */
        .play-btn {
            background: linear-gradient(135deg, #00d2d3, #01a3a4); color: #fff;
            border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 30px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0, 210, 211, 0.4); text-transform: uppercase;
        }
        .play-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(0, 210, 211, 0.6); }
        .play-btn:active { transform: translateY(1px); }

        .secondary-btn {
            background: transparent; color: #00d2d3; border: 2px solid #00d2d3;
            padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 20px;
            cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .secondary-btn:hover { background: #00d2d3; color: #000; }

        /* Level Up Flash Animation */
        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 20;
        }
        .flash-anim { animation: flash 0.5s ease-out; }
        @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }
        
        #levelUpText {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40px; color: #ff9f43; font-weight: bold; text-shadow: 0 0 20px #ff9f43;
            opacity: 0; pointer-events: none; z-index: 21; transition: 0.5s;
        }
        .text-pop { animation: popText 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popText { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 1; } 80% { transform: translate(-50%, -60%) scale(1.2); opacity: 1; } 100% { opacity: 0; } }

        /* Mobile D-Pad Controls */
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; width: 220px; }
        .d-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 210, 211, 0.3); color: #00d2d3; height: 60px; border-radius: 12px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .d-btn:active { background: #00d2d3; color: #000; transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">SKOR:<span id="scoreVal">0</span></div>
        <div class="hud-item" style="color:#ff9f43;">SEVİYE:<span id="levelVal">1</span></div>
        <div class="hud-item">REKOR:<span id="highScoreVal">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="flashOverlay"></div>
    <div id="levelUpText">SEVİYE ATLANDI!</div>

    <div class="controls">
        <div></div><div id="btnUp" class="d-btn">▲</div><div></div>
        <div id="btnLeft" class="d-btn">◄</div><div id="btnDown" class="d-btn">▼</div><div id="btnRight" class="d-btn">►</div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>YILAN EFSANESİ</h1>
        <p style="color:#888; margin-bottom: 20px;">Ayarları Seçin</p>
        
        <select id="gameMode" class="mode-select">
            <option value="classic">Mod: Klasik (Classic)</option>
            <option value="time">Mod: Zamana Karşı (Time Attack)</option>
            <option value="survival">Mod: Hayatta Kalma (Survival)</option>
        </select>

        <button class="play-btn" onclick="initGame()">OYNA</button>
    </div>

    <div id="gameOverScreen" class="overlay" style="display: none;">
        <h1 style="color: #ff6b6b;">OYUN BİTTİ</h1>
        <h2 style="margin: 10px 0;">Skor: <span id="finalScore" style="color:#00d2d3;">0</span></h2>
        
        <button class="play-btn" style="margin-top: 15px;" onclick="document.getElementById('gameOverScreen').style.display='none'; document.getElementById('startScreen').style.display='block';">YENİDEN BAŞLA</button>
        <br>
        <button class="secondary-btn" onclick="shareScore()">Skoru Paylaş 📤</button>
    </div>

    <script>
        // --- 1. Audio Engine (Web Audio API for Music & SFX) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmOscillator, bgmGain;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSFX(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'levelUp') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        // Procedural Background Music (Synth Arpeggio Loop)
        let bgmInterval;
        const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, C (C Major)
        let noteIndex = 0;

        function startBGM() {
            if(!audioCtx) return;
            stopBGM();
            isMusicPlaying = true;
            bgmInterval = setInterval(() => {
                if(!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // very subtle background
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                noteIndex = (noteIndex + 1) % notes.length;
            }, 300); // tempo
        }

        function stopBGM() {
            isMusicPlaying = false;
            if(bgmInterval) clearInterval(bgmInterval);
        }

        // --- 2. Game Variables & State ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let mode = "classic";
        let score = 0, level = 1, highScore = localStorage.getItem("proSnakeHighScore") || 0;
        document.getElementById("highScoreVal").innerText = highScore;
        
        // Fluid Lerp Arrays
        let snake = [];     // Current logical grid position
        let prevSnake = []; // Previous logical grid position for interpolation
        
        let food = {x: 0, y: 0};
        let walls = [];     // Dynamic obstacles
        
        let d = "RIGHT";
        let nextD = "RIGHT";
        
        let gameActive = false;
        let lastTickTime = 0;
        let tickRate = 180; // MS per logic tick (controls speed)
        let reqAnimFrameId;

        // --- 3. Fluid Movement Logic (LERP) ---
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- 4. Core Game Engine ---
        function initGame() {
            initAudio();
            document.getElementById("startScreen").style.display = "none";
            mode = document.getElementById("gameMode").value;
            
            snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            prevSnake = JSON.parse(JSON.stringify(snake));
            d = "RIGHT"; nextD = "RIGHT";
            score = 0; level = 1; tickRate = (mode === "time" || mode === "survival") ? 130 : 180;
            walls = [];
            
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("levelVal").innerText = level;
            
            spawnFood();
            startBGM();
            gameActive = true;
            lastTickTime = performance.now();
            
            if(reqAnimFrameId) cancelAnimationFrame(reqAnimFrameId);
            gameLoop(performance.now());
        }

        function spawnFood() {
            let valid = false;
            while(!valid) {
                food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
                valid = true;
                snake.forEach(s => { if(s.x === food.x && s.y === food.y) valid = false; });
                walls.forEach(w => { if(w.x === food.x && w.y === food.y) valid = false; });
            }
        }

        function buildLevel() {
            walls = [];
            // Level 2: Static corners
            if(level === 2 || level === 4) {
                walls.push({x:2, y:2}, {x:3, y:2}, {x:16, y:17}, {x:17, y:17});
            }
            // Level 3+: More complex dynamic walls
            if(level >= 3) {
                let numWalls = level * 2;
                for(let i=0; i<numWalls; i++) {
                    let wx = Math.floor(Math.random() * (tileCount-4)) + 2;
                    let wy = Math.floor(Math.random() * (tileCount-4)) + 2;
                    // Dont spawn on snake head or food
                    if(!(Math.abs(wx - snake[0].x) < 3 && Math.abs(wy - snake[0].y) < 3)) {
                        walls.push({x: wx, y: wy});
                    }
                }
            }
        }

        function logicTick() {
            d = nextD;
            prevSnake = JSON.parse(JSON.stringify(snake)); // Save state for Lerp

            let head = {x: snake[0].x, y: snake[0].y};
            if(d == "LEFT") head.x -= 1;
            if(d == "UP") head.y -= 1;
            if(d == "RIGHT") head.x += 1;
            if(d == "DOWN") head.y += 1;

            // Moving Walls for Survival Mode
            if(mode === "survival" && level >= 2) {
                walls.forEach(w => { if(Math.random() > 0.8) w.x += (Math.random() > 0.5 ? 1 : -1); });
            }

            // Collisions
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
               snake.some(s => s.x === head.x && s.y === head.y) ||
               walls.some(w => w.x === head.x && w.y === head.y)) {
                gameOver(); return;
            }

            snake.unshift(head);

            // Eat Food
            if(head.x === food.x && head.y === food.y) {
                score++;
                playSFX('eat');
                document.getElementById("scoreVal").innerText = score;
                
                if(score % 5 === 0) {
                    level++;
                    tickRate = Math.max(50, tickRate - 15); // Speed up
                    document.getElementById("levelVal").innerText = level;
                    playSFX('levelUp');
                    buildLevel();
                    
                    // Flash Animation
                    let flash = document.getElementById("flashOverlay");
                    let txt = document.getElementById("levelUpText");
                    flash.classList.add("flash-anim");
                    txt.classList.add("text-pop");
                    setTimeout(() => { flash.classList.remove("flash-anim"); txt.classList.remove("text-pop"); }, 1000);
                }
                spawnFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function gameOver() {
            gameActive = false;
            stopBGM();
            playSFX('die');
            if(score > highScore) {
                highScore = score;
                localStorage.setItem("proSnakeHighScore", highScore);
                document.getElementById("highScoreVal").innerText = highScore;
            }
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").style.display = "block";
        }

        // --- 5. Render & Lerp Engine ---
        function gameLoop(currentTime) {
            if(!gameActive) return;
            reqAnimFrameId = requestAnimationFrame(gameLoop);

            let elapsedTime = currentTime - lastTickTime;
            
            // Trigger Logical Tick
            if(elapsedTime >= tickRate) {
                logicTick();
                lastTickTime = currentTime;
                elapsedTime = 0; // Reset for lerp calculation
            }

            // Calculate interpolation progress (0.0 to 1.0)
            let progress = Math.min(elapsedTime / tickRate, 1);

            draw(progress);
        }

        function draw(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Walls
            ctx.fillStyle = "#ff6b6b";
            ctx.shadowBlur = 10; ctx.shadowColor = "#ff6b6b";
            walls.forEach(w => { ctx.fillRect(w.x * gridSize, w.y * gridSize, gridSize-2, gridSize-2); });
            ctx.shadowBlur = 0;

            // Draw Food (Mouse shape)
            let fx = food.x * gridSize + gridSize/2;
            let fy = food.y * gridSize + gridSize/2;
            ctx.fillStyle = "#ff9f43";
            ctx.shadowBlur = 15; ctx.shadowColor = "#ff9f43";
            ctx.beginPath(); ctx.ellipse(fx, fy, 8, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(fx-5, fy-5, 3, 0, Math.PI*2); ctx.fill(); // Ears
            ctx.beginPath(); ctx.arc(fx+5, fy-5, 3, 0, Math.PI*2); ctx.fill(); 
            ctx.strokeStyle="#ff9f43"; ctx.beginPath(); ctx.moveTo(fx, fy+5); ctx.lineTo(fx, fy+15); ctx.stroke(); // Tail
            ctx.shadowBlur = 0;

            // Draw Snake (Lerped positions for fluid movement)
            for(let i = 0; i < snake.length; i++) {
                let s = snake[i];
                let p = prevSnake[i] || s; // Fallback for new segments

                // Interpolate X and Y
                let drawX = lerp(p.x, s.x, progress) * gridSize;
                let drawY = lerp(p.y, s.y, progress) * gridSize;

                ctx.fillStyle = i === 0 ? "#00d2d3" : "#01a3a4";
                if(i===0) { ctx.shadowBlur = 15; ctx.shadowColor = "#00d2d3"; }
                
                ctx.beginPath();
                ctx.arc(drawX + gridSize/2, drawY + gridSize/2, gridSize/2.2, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes for head
                if(i === 0) {
                    ctx.fillStyle = "#fff";
                    ctx.beginPath(); ctx.arc(drawX + gridSize/2 + (d=="RIGHT"?4:d=="LEFT"?-4:0), drawY + gridSize/2 + (d=="DOWN"?4:d=="UP"?-4:0) - 3, 2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(drawX + gridSize/2 + (d=="RIGHT"?4:d=="LEFT"?-4:0), drawY + gridSize/2 + (d=="DOWN"?4:d=="UP"?-4:0) + 3, 2, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        // --- 6. Input Handlers ---
        window.addEventListener('keydown', e => {
            initAudio(); // Required to unlock audio context on web
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
            if(e.keyCode == 37 && d != "RIGHT") nextD = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") nextD = "UP";
            else if(e.keyCode == 39 && d != "LEFT") nextD = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") nextD = "DOWN";
        });

        const bindBtn = (id, dir, opp) => {
            const btn = document.getElementById(id);
            const handler = (e) => { e.preventDefault(); initAudio(); if(d != opp) nextD = dir; };
            btn.addEventListener("touchstart", handler, {passive: false});
            btn.addEventListener("mousedown", handler);
        };
        bindBtn("btnUp", "UP", "DOWN"); bindBtn("btnDown", "DOWN", "UP"); 
        bindBtn("btnLeft", "LEFT", "RIGHT"); bindBtn("btnRight", "RIGHT", "LEFT");

        // --- 7. Web Share API ---
        function shareScore() {
            if (navigator.share) {
                navigator.share({
                    title: 'Yılan Oyunu Rekorum!',
                    text: `SnakeZilla'da ${score} skor yaptım ve Seviye ${level}'e ulaştım! Sen beni geçebilir misin?`,
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Tarayıcınız paylaşma özelliğini desteklemiyor. Skor: " + score);
            }
        }
    </script>
</body>
</html>
