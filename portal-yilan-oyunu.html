<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Portal Yılan Oyunu oyna. Uzay portallarından geç, boyut değiştir ve en yüksek skoru yap! Ücretsiz, akıcı ve mobil uyumlu modern portal yılan oyunu.">
    <meta name="keywords" content="portal yılan oyunu, yılan oyunu oyna, ücretsiz yılan oyunu, ışınlanma yılan oyunu, snake oyunu">
    <title>Portal Yılan Oyunu | Portal Space - SnakeZilla TR</title>
    <style>
        /* Sci-Fi Space Grid Theme */
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #030712;
            background-image: linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 25px 25px; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
            touch-action: none;
        }

        /* Transparent Glass HUD */
        #hud {
            position: absolute; top: 15px; width: 90vw; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3, 7, 18, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(0, 210, 255, 0.2);
            box-sizing: border-box; z-index: 5; font-weight: bold; font-size: 16px; color: #00d2ff;
        }

        .hud-item span { color: #fff; font-size: 18px; margin-left: 5px; }

        /* Game Canvas */
        canvas {
            background: rgba(0, 0, 0, 0.7); border-radius: 12px; border: 2px solid #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); display: block; max-width: 95vw;
        }

        /* UI Overlays */
        .overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(3, 7, 18, 0.95); padding: 40px; border-radius: 20px;
            border: 1px solid #00d2ff; box-shadow: 0 0 40px rgba(0, 210, 255, 0.3);
            text-align: center; z-index: 10; width: 80vw; max-width: 350px;
        }

        .overlay h1 { margin-top: 0; color: #00d2ff; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0,210,255,0.5); }

        /* Premium Play Button */
        .play-btn {
            background: linear-gradient(135deg, #00d2ff, #00a8cc); color: #fff;
            border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 30px; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); text-transform: uppercase; margin-top: 10px;
        }
        .play-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6); }
        .play-btn:active { transform: translateY(1px); }

        .secondary-btn {
            background: transparent; color: #00d2ff; border: 2px solid #00d2ff;
            padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 20px;
            cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .secondary-btn:hover { background: #00d2ff; color: #000; }

        /* Level Up Flash Animation */
        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff9f43; opacity: 0; pointer-events: none; z-index: 20;
        }
        .flash-anim { animation: flash 0.4s ease-out; }
        @keyframes flash { 0% { opacity: 0.5; } 100% { opacity: 0; } }
        
        #levelUpText {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; color: #fff; font-weight: bold; text-shadow: 0 0 20px #ff9f43;
            opacity: 0; pointer-events: none; z-index: 21; transition: 0.5s;
        }
        .text-pop { animation: popText 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popText { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 1; } 80% { transform: translate(-50%, -60%) scale(1.2); opacity: 1; } 100% { opacity: 0; } }

        /* Mobile Controls */
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; width: 220px; }
        .d-btn { background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3); color: #00d2ff; height: 60px; border-radius: 12px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .d-btn:active { background: #00d2ff; color: #000; transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">SKOR:<span id="scoreVal">0</span></div>
        <div class="hud-item" style="color:#ff9f43;">BOYUT:<span id="levelVal">1</span></div>
        <div class="hud-item">REKOR:<span id="highScoreVal">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="flashOverlay"></div>
    <div id="levelUpText">BOYUT DEĞİŞTİ!</div>

    <div class="controls">
        <div></div><div id="btnUp" class="d-btn">▲</div><div></div>
        <div id="btnLeft" class="d-btn">◄</div><div id="btnDown" class="d-btn">▼</div><div id="btnRight" class="d-btn">►</div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>PORTAL SPACE</h1>
        <p style="color:#aaa; margin-bottom: 25px;">Mavi ve Turuncu portalları kullanarak boyutlar arası ışınlanın ve engelleri aşın!</p>
        <button class="play-btn" onclick="initGame()">OYNA</button>
    </div>

    <div id="gameOverScreen" class="overlay" style="display: none;">
        <h1 style="color: #ff6b6b;">BOYUTTA KAYBOLDUNUZ</h1>
        <h2 style="margin: 10px 0;">Skor: <span id="finalScore" style="color:#00d2ff;">0</span></h2>
        <button class="play-btn" style="margin-top: 15px;" onclick="document.getElementById('gameOverScreen').style.display='none'; document.getElementById('startScreen').style.display='block';">YENİDEN BAŞLA</button>
        <br>
        <button class="secondary-btn" onclick="shareScore()">Skoru Paylaş 📤</button>
    </div>

    <script>
        // --- Web Audio Synth Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmInterval;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSFX(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'portal') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'levelUp') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // Space Ambient Loop
        const notes = [220.00, 293.66, 349.23, 392.00];
        let noteIndex = 0;

        function startBGM() {
            if(!audioCtx) return;
            stopBGM(); isMusicPlaying = true;
            bgmInterval = setInterval(() => {
                if(!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                noteIndex = (noteIndex + 1) % notes.length;
            }, 400);
        }

        function stopBGM() { isMusicPlaying = false; if(bgmInterval) clearInterval(bgmInterval); }

        // --- Game Setup ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let score = 0, level = 1, highScore = localStorage.getItem("portalYilanRekor") || 0;
        document.getElementById("highScoreVal").innerText = highScore;
        
        let snake = []; let prevSnake = []; 
        let food = {x: 0, y: 0};
        
        // Portals definitions
        let bluePortal = {x: 3, y: 3};
        let orangePortal = {x: 16, y: 16};
        
        let d = "RIGHT", nextD = "RIGHT";
        let gameActive = false, lastTickTime = 0, reqAnimFrameId;
        let tickRate = 180;
        let justTeleported = false;

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function initGame() {
            initAudio(); document.getElementById("startScreen").style.display = "none";
            
            snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            prevSnake = JSON.parse(JSON.stringify(snake));
            d = "RIGHT"; nextD = "RIGHT";
            score = 0; level = 1; tickRate = 180;
            
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("levelVal").innerText = level;
            
            generatePortals();
            spawnFood(); startBGM(); gameActive = true;
            lastTickTime = performance.now();
            
            if(reqAnimFrameId) cancelAnimationFrame(reqAnimFrameId);
            gameLoop(performance.now());
        }

        function generatePortals() {
            // Keep them on opposite sides or random
            bluePortal = { x: Math.floor(Math.random() * (tileCount / 2 - 2)) + 1, y: Math.floor(Math.random() * (tileCount - 2)) + 1 };
            orangePortal = { x: Math.floor(Math.random() * (tileCount / 2 - 2)) + Math.floor(tileCount / 2) + 1, y: Math.floor(Math.random() * (tileCount - 2)) + 1 };
        }

        function spawnFood() {
            let valid = false;
            while(!valid) {
                food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
                valid = true;
                snake.forEach(s => { if(s.x === food.x && s.y === food.y) valid = false; });
                if((food.x === bluePortal.x && food.y === bluePortal.y) || (food.x === orangePortal.x && food.y === orangePortal.y)) valid = false;
            }
        }

        function logicTick() {
            d = nextD;
            prevSnake = JSON.parse(JSON.stringify(snake));

            let head = {x: snake[0].x, y: snake[0].y};
            if(d == "LEFT") head.x -= 1;
            if(d == "UP") head.y -= 1;
            if(d == "RIGHT") head.x += 1;
            if(d == "DOWN") head.y += 1;

            // Portal Teleportation Mechanic
            if (head.x === bluePortal.x && head.y === bluePortal.y && !justTeleported) {
                head.x = orangePortal.x; head.y = orangePortal.y;
                playSFX('portal');
                justTeleported = true;
            } else if (head.x === orangePortal.x && head.y === orangePortal.y && !justTeleported) {
                head.x = bluePortal.x; head.y = bluePortal.y;
                playSFX('portal');
                justTeleported = true;
            } else {
                justTeleported = false;
            }

            // Standard Collisions (Screen borders or self)
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
               snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver(); return;
            }

            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                score++; playSFX('eat');
                document.getElementById("scoreVal").innerText = score;
                
                if(score % 5 === 0) {
                    level++;
                    tickRate = Math.max(80, tickRate - 15);
                    generatePortals(); // Shuffle portal positions on level up
                    document.getElementById("levelVal").innerText = level;
                    playSFX('levelUp');
                    
                    let flash = document.getElementById("flashOverlay");
                    let txt = document.getElementById("levelUpText");
                    flash.classList.add("flash-anim"); txt.classList.add("text-pop");
                    setTimeout(() => { flash.classList.remove("flash-anim"); txt.classList.remove("text-pop"); }, 1000);
                }
                spawnFood();
            } else {
                snake.pop(); 
            }
        }

        function gameOver() {
            gameActive = false; stopBGM(); playSFX('die');
            if(score > highScore) {
                highScore = score;
                localStorage.setItem("portalYilanRekor", highScore);
                document.getElementById("highScoreVal").innerText = highScore;
            }
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").style.display = "block";
        }

        // Draw Portal Rings with Neon Glow
        function drawPortal(px, py, color) {
            ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.shadowBlur = 15; ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(px, py, 9, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function gameLoop(currentTime) {
            if(!gameActive) return;
            reqAnimFrameId = requestAnimationFrame(gameLoop);

            let elapsedTime = currentTime - lastTickTime;
            
            if(elapsedTime >= tickRate) {
                logicTick();
                lastTickTime = currentTime;
                elapsedTime = 0; 
            }

            let progress = Math.min(elapsedTime / tickRate, 1);
            draw(progress);
        }

        function draw(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Portals
            drawPortal(bluePortal.x * gridSize + gridSize/2, bluePortal.y * gridSize + gridSize/2, "#00d2ff");
            drawPortal(orangePortal.x * gridSize + gridSize/2, orangePortal.y * gridSize + gridSize/2, "#ff9f43");

            // Draw Food (Space Core / Energy Orb)
            let fx = food.x * gridSize + gridSize/2;
            let fy = food.y * gridSize + gridSize/2;
            ctx.fillStyle = "#fff"; ctx.shadowBlur = 12; ctx.shadowColor = "#00ffcc";
            ctx.beginPath(); ctx.arc(fx, fy, 6, 0, Math.PI*2); ctx.fill();
            // Outer Ring
            ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(fx, fy, 9, 0, Math.PI*2); ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Lerped Quantum Snake
            for(let i = 0; i < snake.length; i++) {
                let s = snake[i]; let p = prevSnake[i] || s; 
                
                // If the piece teleported, don't interpolate over the whole screen
                let drawX, drawY;
                if (Math.abs(s.x - p.x) > 1 || Math.abs(s.y - p.y) > 1) {
                    drawX = s.x * gridSize; drawY = s.y * gridSize; // Snap to target
                } else {
                    drawX = lerp(p.x, s.x, progress) * gridSize;
                    drawY = lerp(p.y, s.y, progress) * gridSize;
                }

                ctx.fillStyle = i === 0 ? "#00d2ff" : "rgba(0, 210, 255, 0.6)";
                if(i===0) { ctx.shadowBlur = 15; ctx.shadowColor = "#00d2ff"; }
                
                ctx.beginPath(); ctx.arc(drawX + gridSize/2, drawY + gridSize/2, gridSize/2.2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                if(i === 0) {
                    ctx.fillStyle = "#ff9f43"; // Portal Orange eyes
                    ctx.beginPath(); ctx.arc(drawX + gridSize/2 + (d=="RIGHT"?4:d=="LEFT"?-4:0), drawY + gridSize/2 + (d=="DOWN"?4:d=="UP"?-4:0) - 3, 2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(drawX + gridSize/2 + (d=="RIGHT"?4:d=="LEFT"?-4:0), drawY + gridSize/2 + (d=="DOWN"?4:d=="UP"?-4:0) + 3, 2, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        // Controls
        window.addEventListener('keydown', e => {
            initAudio(); 
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
            if(e.keyCode == 37 && d != "RIGHT") nextD = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") nextD = "UP";
            else if(e.keyCode == 39 && d != "LEFT") nextD = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") nextD = "DOWN";
        });

        const bindBtn = (id, dir, opp) => {
            const btn = document.getElementById(id);
            const handler = (e) => { e.preventDefault(); initAudio(); if(d != opp) nextD = dir; };
            btn.addEventListener("touchstart", handler, {passive: false});
            btn.addEventListener("mousedown", handler);
        };
        bindBtn("btnUp", "UP", "DOWN"); bindBtn("btnDown", "DOWN", "UP"); 
        bindBtn("btnLeft", "LEFT", "RIGHT"); bindBtn("btnRight", "RIGHT", "LEFT");

        function shareScore() {
            if (navigator.share) {
                navigator.share({
                    title: 'Portal Space Rekorum!',
                    text: `SnakeZilla Portal modunda ${score} skor yaptım! Portalları aşıp beni geçebilir misin?`,
                    url: window.location.href
                }).catch(console.error);
            } else alert("Tarayıcınız paylaşma özelliğini desteklemiyor. Skor: " + score);
        }
    </script>
</body>
</html>
