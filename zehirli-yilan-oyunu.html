<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Zehirli Yılan Oyunu oyna. Zehirli kafataslarından kaçın, fareleri yakala ve hayatta kal! Ücretsiz, akıcı ve mobil uyumlu modern yılan oyunu.">
    <meta name="keywords" content="zehirli yılan oyunu, yılan oyunu oyna, ücretsiz yılan oyunu, yılan oyunları, online yılan oyunu">
    <title>Zehirli Yılan Oyunu | Toxic Jungle - SnakeZilla TR</title>
    <style>
        /* Toxic Cyberpunk Theme */
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #050805;
            background-image: radial-gradient(#111a11 1px, transparent 1px);
            background-size: 30px 30px; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
            touch-action: none;
        }

        /* Transparent HUD */
        #hud {
            position: absolute; top: 15px; width: 90vw; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 15, 5, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(57, 255, 20, 0.3);
            box-sizing: border-box; z-index: 5; font-weight: bold; font-size: 16px; color: #39ff14;
        }

        .hud-item span { color: #fff; font-size: 18px; margin-left: 5px; }

        /* Game Canvas */
        canvas {
            background: #080c08; border-radius: 12px; border: 2px solid #39ff14;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); display: block; max-width: 95vw;
        }

        /* Overlays */
        .overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(5, 8, 5, 0.95); padding: 40px; border-radius: 20px;
            border: 1px solid #39ff14; box-shadow: 0 0 40px rgba(57, 255, 20, 0.3);
            text-align: center; z-index: 10; width: 80vw; max-width: 350px;
        }

        .overlay h1 { margin-top: 0; color: #39ff14; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(57,255,20,0.5); }

        /* Premium Play Button */
        .play-btn {
            background: linear-gradient(135deg, #39ff14, #2eb810); color: #000;
            border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 30px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(57, 255, 20, 0.4); text-transform: uppercase; margin-top: 10px;
        }
        .play-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(57, 255, 20, 0.6); }
        .play-btn:active { transform: translateY(1px); }

        .secondary-btn {
            background: transparent; color: #39ff14; border: 2px solid #39ff14;
            padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 20px;
            cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .secondary-btn:hover { background: #39ff14; color: #000; }

        /* Level Up Flash Overlay */
        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #39ff14; opacity: 0; pointer-events: none; z-index: 20;
        }
        .flash-anim { animation: flash 0.4s ease-out; }
        @keyframes flash { 0% { opacity: 0.5; } 100% { opacity: 0; } }
        
        #levelUpText {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; color: #fff; font-weight: bold; text-shadow: 0 0 20px #39ff14;
            opacity: 0; pointer-events: none; z-index: 21; transition: 0.5s;
        }
        .text-pop { animation: popText 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popText { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 1; } 80% { transform: translate(-50%, -60%) scale(1.2); opacity: 1; } 100% { opacity: 0; } }

        /* Mobile Controls */
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; width: 220px; }
        .d-btn { background: rgba(57, 255, 20, 0.05); border: 1px solid rgba(57, 255, 20, 0.3); color: #39ff14; height: 60px; border-radius: 12px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .d-btn:active { background: #39ff14; color: #000; transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">SKOR:<span id="scoreVal">0</span></div>
        <div class="hud-item" style="color:#fff;">SEVİYE:<span id="levelVal">1</span></div>
        <div class="hud-item">REKOR:<span id="highScoreVal">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="flashOverlay"></div>
    <div id="levelUpText">ORMAN ZEHİRLENİYOR!</div>

    <div class="controls">
        <div></div><div id="btnUp" class="d-btn">▲</div><div></div>
        <div id="btnLeft" class="d-btn">◄</div><div id="btnDown" class="d-btn">▼</div><div id="btnRight" class="d-btn">►</div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>ZEHİRLİ ORMAN</h1>
        <p style="color:#aaa; margin-bottom: 25px;">Mor kafataslarına dikkat edin! Her yem yediğinizde yer değiştirirler.</p>
        <button class="play-btn" onclick="initGame()">OYNA</button>
    </div>

    <div id="gameOverScreen" class="overlay" style="display: none;">
        <h1 style="color: #ff4757;">ZEHİRLENDİNİZ!</h1>
        <h2 style="margin: 10px 0;">Skor: <span id="finalScore" style="color:#39ff14;">0</span></h2>
        <button class="play-btn" style="margin-top: 15px;" onclick="document.getElementById('gameOverScreen').style.display='none'; document.getElementById('startScreen').style.display='block';">YENİDEN BAŞLA</button>
        <br>
        <button class="secondary-btn" onclick="shareScore()">Skoru Paylaş 📤</button>
    </div>

    <script>
        // --- Web Audio Synth Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmInterval;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSFX(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'levelUp') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(290, now);
                osc.frequency.setValueAtTime(580, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // Toxic Jungle Ambient Loop
        const notes = [146.83, 164.81, 130.81, 110.00]; // Deep spooky drone
        let noteIndex = 0;

        function startBGM() {
            if(!audioCtx) return;
            stopBGM(); isMusicPlaying = true;
            bgmInterval = setInterval(() => {
                if(!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                noteIndex = (noteIndex + 1) % notes.length;
            }, 250);
        }

        function stopBGM() { isMusicPlaying = false; if(bgmInterval) clearInterval(bgmInterval); }

        // --- Game Setup ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let score = 0, level = 1, highScore = localStorage.getItem("zehirliYilanRekor") || 0;
        document.getElementById("highScoreVal").innerText = highScore;
        
        let snake = []; let prevSnake = []; 
        let food = {x: 0, y: 0};
        let poisons = []; // Poison Skulls array
        
        let d = "RIGHT", nextD = "RIGHT";
        let gameActive = false, lastTickTime = 0, reqAnimFrameId;
        let tickRate = 170;

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function initGame() {
            initAudio(); document.getElementById("startScreen").style.display = "none";
            
            snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            prevSnake = JSON.parse(JSON.stringify(snake));
            d = "RIGHT"; nextD = "RIGHT";
            score = 0; level = 1; tickRate = 170;
            poisons = [];
            
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("levelVal").innerText = level;
            
            // Initial 1 poison skull
            poisons.push(generateRandomPos());
            spawnFood(); startBGM(); gameActive = true;
            lastTickTime = performance.now();
            
            if(reqAnimFrameId) cancelAnimationFrame(reqAnimFrameId);
            gameLoop(performance.now());
        }

        function generateRandomPos() {
            return { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
        }

        function spawnFood() {
            let valid = false;
            while(!valid) {
                food = generateRandomPos();
                valid = true;
                snake.forEach(s => { if(s.x === food.x && s.y === food.y) valid = false; });
                poisons.forEach(p => { if(p.x === food.x && p.y === food.y) valid = false; });
            }
        }

        function teleportPoisons() {
            poisons.forEach((p, idx) => {
                let valid = false;
                while(!valid) {
                    let newPos = generateRandomPos();
                    valid = true;
                    // Don't teleport onto snake head or food
                    if(Math.abs(newPos.x - snake[0].x) < 2 && Math.abs(newPos.y - snake[0].y) < 2) valid = false;
                    if(newPos.x === food.x && newPos.y === food.y) valid = false;
                    
                    if(valid) { poisons[idx] = newPos; }
                }
            });
        }

        function logicTick() {
            d = nextD;
            prevSnake = JSON.parse(JSON.stringify(snake));

            let head = {x: snake[0].x, y: snake[0].y};
            if(d == "LEFT") head.x -= 1;
            if(d == "UP") head.y -= 1;
            if(d == "RIGHT") head.x += 1;
            if(d == "DOWN") head.y += 1;

            // Collisions (Borders, Tail, and Poison Skulls)
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
               snake.some(s => s.x === head.x && s.y === head.y) ||
               poisons.some(p => p.x === head.x && p.y === head.y)) {
                gameOver(); return;
            }

            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                score++; playSFX('eat');
                document.getElementById("scoreVal").innerText = score;
                
                if(score % 5 === 0) {
                    level++;
                    tickRate = Math.max(70, tickRate - 15);
                    poisons.push(generateRandomPos()); // Add new poison skull
                    document.getElementById("levelVal").innerText = level;
                    playSFX('levelUp');
                    
                    let flash = document.getElementById("flashOverlay");
                    let txt = document.getElementById("levelUpText");
                    flash.classList.add("flash-anim"); txt.classList.add("text-pop");
                    setTimeout(() => { flash.classList.remove("flash-anim"); txt.classList.remove("text-pop"); }, 1000);
                } else {
                    teleportPoisons(); // Normal eat teleports existing skulls
                }
                spawnFood();
            } else {
                snake.pop(); 
            }
        }

        function gameOver() {
            gameActive = false; stopBGM(); playSFX('die');
            if(score > highScore) {
                highScore = score;
                localStorage.setItem("zehirliYilanRekor", highScore);
                document.getElementById("highScoreVal").innerText = highScore;
            }
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverScreen").style.display = "block";
        }

        // Pro Skull Drawing Interface
        function drawSkull(px, py) {
            ctx.fillStyle = "#b026ff"; ctx.shadowBlur = 12; ctx.shadowColor = "#b026ff";
            ctx.beginPath(); ctx.arc(px, py-2, 6, 0, Math.PI*2); ctx.fill(); 
            ctx.fillRect(px-4, py+2, 8, 5); ctx.shadowBlur = 0;
            
            ctx.fillStyle = "#000"; 
            ctx.beginPath(); ctx.arc(px-2.5, py-2, 1.5, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(px+2.5, py-2, 1.5, 0, Math.PI*2); ctx.fill();
            
            ctx.strokeStyle="#000"; ctx.lineWidth=1; 
            ctx.beginPath(); ctx.moveTo(px-2, py+2); ctx.lineTo(px-2, py+6); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, py+2); ctx.lineTo(px, py+6); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(px+2, py+2); ctx.lineTo(px+2, py+6); ctx.stroke();
        }

        function gameLoop(currentTime) {
            if(!gameActive) return;
            reqAnimFrameId = requestAnimationFrame(gameLoop);

            let elapsedTime = currentTime - lastTickTime;
            
            if(elapsedTime >= tickRate) {
                logicTick();
                lastTickTime = currentTime;
                elapsedTime = 0; 
            }

            let progress = Math.min(elapsedTime / tickRate, 1);
            draw(progress);
        }

        function draw(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Poison Skulls
            poisons.forEach(p => {
                drawSkull(p.x * gridSize + gridSize/2, p.y * gridSize + gridSize/2);
            });

            // Draw Food (Mouse)
            let fx = food.x * gridSize + gridSize/2;
            let fy = food.y * gridSize + gridSize/2;
            ctx.fillStyle = "#ff9f43"; ctx.shadowBlur = 10; ctx.shadowColor = "#ff9f43";
            ctx.beginPath(); ctx.ellipse(fx, fy, 8, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(fx-5, fy-5, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(fx+5, fy-5, 2.5, 0, Math.PI*2); ctx.fill(); 
            ctx.strokeStyle="#ff9f43"; ctx.beginPath(); ctx.moveTo(fx, fy+4); ctx.lineTo(fx, fy+12); ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Lerped Toxic Snake
            for(let i = 0; i < snake.length; i++) {
                let s = snake[i]; let p = prevSnake[i] || s; 
                let drawX = lerp(p.x, s.x, progress) * gridSize;
                let drawY = lerp(p.y, s.y, progress) * gridSize;

                ctx.fillStyle = i === 0 ? "#39ff14" : "#2eb810";
                if(i===0) { ctx.shadowBlur = 15; ctx.shadowColor = "#39ff14"; }
                
                ctx.beginPath(); ctx.arc(drawX + gridSize/2, drawY + gridSize/2, gridSize/2.2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                if(i === 0) {
                    ctx.fillStyle = "#fff";
                    ctx.beginPath(); ctx.arc(drawX + gridSize/2 + (d=="RIGHT"?4:d=="LEFT"?-4:0), drawY + gridSize/2 + (d=="DOWN"?4:d=="UP"?-4:0) - 3, 2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(drawX + gridSize/2 + (d=="RIGHT"?4:d=="LEFT"?-4:0), drawY + gridSize/2 + (d=="DOWN"?4:d=="UP"?-4:0) + 3, 2, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        // Controls
        window.addEventListener('keydown', e => {
            initAudio(); 
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
            if(e.keyCode == 37 && d != "RIGHT") nextD = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") nextD = "UP";
            else if(e.keyCode == 39 && d != "LEFT") nextD = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") nextD = "DOWN";
        });

        const bindBtn = (id, dir, opp) => {
            const btn = document.getElementById(id);
            const handler = (e) => { e.preventDefault(); initAudio(); if(d != opp) nextD = dir; };
            btn.addEventListener("touchstart", handler, {passive: false});
            btn.addEventListener("mousedown", handler);
        };
        bindBtn("btnUp", "UP", "DOWN"); bindBtn("btnDown", "DOWN", "UP"); 
        bindBtn("btnLeft", "LEFT", "RIGHT"); bindBtn("btnRight", "RIGHT", "LEFT");

        function shareScore() {
            if (navigator.share) {
                navigator.share({
                    title: 'Zehirli Orman Rekorum!',
                    text: `SnakeZilla'da Zehirli Orman modunda ${score} skor yaptım! Benim rekorumu kırabilir misin?`,
                    url: window.location.href
                }).catch(console.error);
            } else alert("Tarayıcınız paylaşma özelliğini desteklemiyor. Skor: " + score);
        }
    </script>
</body>
</html>
