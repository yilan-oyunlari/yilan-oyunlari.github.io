<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yilan Oyunu Google - Gelişmiş Mod</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .ui { display: flex; gap: 20px; margin-bottom: 10px; color: #10ffb2; }
        #canvas { border: 4px solid #10ffb2; box-shadow: 0 0 20px rgba(16,255,178,0.3); }
        .controls { margin-top: 15px; }
        select { background: #1a1a1a; color: #10ffb2; border: 1px solid #10ffb2; padding: 5px; }
    </style>
</head>
<body>

    <div class="ui">
        <div>SKOR: <span id="score">0</span></div>
        <div>SEVİYE: <span id="level">EASY</span></div>
    </div>
    
    <select id="diff" onchange="resetGame()">
        <option value="200">KOLAY (Easy)</option>
        <option value="120">NORMAL (Medium)</option>
        <option value="60">ZOR (Hard)</option>
    </select>

    <canvas id="canvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let snake = [{x: 10, y: 10}], food = {x: 5, y: 5, type: 'normal'}, dir = 'RIGHT', score = 0, foodCount = 0;

        function resetGame() {
            snake = [{x: 10, y: 10}]; score = 0; foodCount = 0;
            document.getElementById("score").innerText = score;
        }

        function draw() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,400,400);
            
            // Yılan
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? "#10ffb2" : "#0aa875";
                ctx.fillRect(s.x*box, s.y*box, box-2, box-2);
            });

            // Yem
            ctx.fillStyle = food.type === 'super' ? "#ffeb3b" : "#ff4757";
            let size = food.type === 'super' ? box-4 : box-8;
            ctx.fillRect(food.x*box + (food.type === 'super' ? 0 : 5), food.y*box + (food.type === 'super' ? 0 : 5), size, size);
        }

        function update() {
            let head = {x: snake[0].x, y: snake[0].y};
            if(dir === 'UP') head.y--; if(dir === 'DOWN') head.y++;
            if(dir === 'LEFT') head.x--; if(dir === 'RIGHT') head.x++;

            // Çarpışma
            if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
                alert("Game Over! Skor: " + score); resetGame();
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score += (food.type === 'super' ? 10 : 1);
                foodCount++;
                document.getElementById("score").innerText = score;
                
                // Super Food mantığı
                let isSuper = (foodCount % 5 === 0);
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20), type: isSuper ? 'super' : 'normal'};
            } else { snake.pop(); }
            
            draw();
            setTimeout(update, document.getElementById("diff").value);
        }

        window.onkeydown = (e) => {
            if(e.key === "ArrowUp" && dir !== "DOWN") dir = "UP";
            if(e.key === "ArrowDown" && dir !== "UP") dir = "DOWN";
            if(e.key === "ArrowLeft" && dir !== "RIGHT") dir = "LEFT";
            if(e.key === "ArrowRight" && dir !== "LEFT") dir = "RIGHT";
        };

        update();
    </script>
</body>
</html>
