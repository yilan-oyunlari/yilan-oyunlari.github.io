<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Yilan Oyunu Google - Hemen Ücretsiz Oyna | Snake Game</title>
    
    <meta name="description" content="Yilan oyunu Google aramalarında en çok tercih edilen ücretsiz yılan oyunu! Reklamsız, hızlı ve akıcı snake deneyimi için hemen tıklayın ve rekorunuzu geliştirin.">
    <meta name="keywords" content="yilan oyunu google, yılan oyunu oyna, google snake oyunu, yılan oyunu ücretsiz, en iyi yılan oyunu">
    <link rel="canonical" href="https://yilan-oyunlari.github.io/yilan-oyunu-google.html">

    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .game-wrapper { text-align: center; }
        h1 { color: #10ffb2; margin-bottom: 10px; font-size: 1.5rem; }
        
        #gameCanvas { background: #000; border: 4px solid #10ffb2; box-shadow: 0 0 15px rgba(16,255,178,0.3); border-radius: 4px; }
        
        .score-board { font-size: 1.2rem; margin-bottom: 10px; color: #10ffb2; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Yilan Oyunu Google</h1>
        <div class="score-board">Skor: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        let snake = [{x: 10, y: 10}], food = {x: 5, y: 5}, dx = 1, dy = 0, score = 0;

        function gameLoop() {
            // Hareket
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Duvar kontrolü
            if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) return gameOver();
            
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score++; document.getElementById("score").innerText = score;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else { snake.pop(); }

            // Çizim
            ctx.fillStyle = "black"; ctx.fillRect(0,0,400,400);
            ctx.fillStyle = "#ff4757"; ctx.fillRect(food.x*gridSize, food.y*gridSize, 18, 18);
            ctx.fillStyle = "#10ffb2";
            snake.forEach(s => ctx.fillRect(s.x*gridSize, s.y*gridSize, 18, 18));
            
            setTimeout(gameLoop, 150);
        }

        function gameOver() { alert("Oyun Bitti! Skorunuz: " + score); location.reload(); }
        
        window.onkeydown = (e) => {
            if(e.key === "ArrowUp" && dy === 0) { dx=0; dy=-1; }
            else if(e.key === "ArrowDown" && dy === 0) { dx=0; dy=1; }
            else if(e.key === "ArrowLeft" && dx === 0) { dx=-1; dy=0; }
            else if(e.key === "ArrowRight" && dx === 0) { dx=1; dy=0; }
        };
        gameLoop();
    </script>
</body>
</html>
